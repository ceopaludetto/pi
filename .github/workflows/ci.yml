name: CI
run-name: CI (${{ github.event.pull_request.title }})

on:
  pull_request:
    branches: [main]

env:
  CI: true
  DO_NOT_TRACK: 1

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Mise
        uses: jdx/mise-action@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Vite Task
        uses: actions/cache@v5
        with:
          path: node_modules/.vite/task-cache
          key: ${{ runner.os }}-vite-task-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-task-

      - name: Build
        run: mise exec -- vp run -r build

      - name: Lint
        run: mise exec -- pnpm run lint

      - name: Test
        run: mise exec -- vp run -r test
